    <circle cx="1020" cy="148" r="70" fill="none" stroke="#334155" stroke-width="1" opacity="0.6"/>

    <line x1="1020" y1="54" x2="1020" y2="108" stroke="#EF4444" stroke-width="1.8" class="flow-line"/>
    <line x1="1060" y1="148" x2="1116" y2="148" stroke="#0EA5E9" stroke-width="1.8" class="flow-line"/>
