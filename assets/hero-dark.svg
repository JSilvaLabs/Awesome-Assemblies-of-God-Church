    <text x="48" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">AWESOME ASSEMBLIES OF GOD</text>
    <text x="48" y="132" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#CBD5E1">Churches, Accredited Universities, 16 Fundamental Truths, Missions &amp; Ministry Frameworks</text>
    <text x="48" y="158" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">Community-maintained resource hub + live searchable GitHub Pages directory (not an official AG publication)</text>

