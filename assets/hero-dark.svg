  <text x="550" y="257" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Live Search Web App</text>


    <!-- Right-Side Fourfold Gospel Emblem -->
