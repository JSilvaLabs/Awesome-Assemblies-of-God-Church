    <circle cx="1020" cy="148" r="40" fill="#0F172A" stroke="#F59E0B" stroke-width="2.2"/>
    <circle cx="1020" cy="148" r="34" fill="none" stroke="#0EA5E9" stroke-width="0.9" opacity="0.6"/>
    <text x="1020" y="151" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#F8FAFC">AG</text>
    <text x="1020" y="168" text-anchor="middle" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, ui-monospace, monospace" font-size="9" font-weight="700" letter-spacing="1.4" fill="#F59E0B">AWESOME</text>

    <rect x="966" y="30" width="108" height="24" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.4"/>
