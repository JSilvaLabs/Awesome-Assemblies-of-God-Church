  <rect x="48" y="238" width="248" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <circle cx="60" cy="253" r="3.5" fill="#8B5CF6"/>
  <text x="70" y="257" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">30+ Official Position Papers</text>
  <rect x="306" y="238" width="212" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <circle cx="318" cy="253" r="3.5" fill="#10B981"/>
  <text x="328" y="257" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">7 Ministry Frameworks</text>
  <rect x="528" y="238" width="184" height="30" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
