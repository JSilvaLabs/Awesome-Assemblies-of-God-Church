<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 296" width="100%" role="img" aria-label="Awesome Assemblies of God Directory Banner">
  <defs>
    <clipPath id="agHeroClip_dark">
      <rect x="0" y="0" width="1200" height="296" rx="18"/>
    </clipPath>
    <pattern id="agGrid_dark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.38"/>
    </pattern>
    <linearGradient id="fourfoldBar_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="33%" stop-color="#F59E0B"/>
      <stop offset="66%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="agGlow_dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes pulseRing {
        0%   { r: 4.5; opacity: 0.9; }
        70%  { r: 10; opacity: 0; }
        100% { r: 10; opacity: 0; }
      }
      @keyframes orbitSpin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dataFlow {
        0%   { stroke-dashoffset: 36; }
        100% { stroke-dashoffset: 0; }
      }
      .pulse-ring { animation: pulseRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .orbit-ring { transform-origin: 1020px 148px; animation: orbitSpin 44s linear infinite; }
      .flow-line  { stroke-dasharray: 5 4; animation: dataFlow 2.2s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#agHeroClip_dark)">
    <rect x="0" y="0" width="1200" height="296" fill="#0B1120"/>
    <rect x="0" y="0" width="1200" height="296" fill="url(#agGrid_dark)"/>
    <circle cx="1020" cy="148" r="210" fill="url(#agGlow_dark)"/>
    <rect x="0" y="0" width="1200" height="5" fill="url(#fourfoldBar_dark)"/>

    <rect x="48" y="26" width="690" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
